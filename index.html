<style>
:root{--navy:#0b2f4a;--teal:#0e8c8c;--sand:#f3e7cf;--bg:#f7f3ea;--card:#fff;--ink:#12283a;--mut:#5b6b78;--line:#d9d2c0;--ok:#157347;--bad:#b42318;--warn:#a15c07;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a26;--card:#12293a;--ink:#eef3f6;--mut:#a3b4c0;--line:#27445a;--sand:#2a3b3f;--teal:#35b5b5;--ok:#58c58a;--bad:#ff8d82;--warn:#f0b35a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}.logo{height:64px;width:auto;border-radius:14px;background:rgb(243,241,237);padding:2px;image-rendering:auto}header h1{margin:0;font-size:1.25rem}header small{display:block;opacity:.8;font-size:.8rem}
select,input,button{font:inherit}select,input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:48px}
label{display:block;font-weight:600;margin:10px 0 4px}.hint{color:var(--mut);font-size:.85rem;font-weight:400}
.btn{min-height:48px;padding:10px 16px;border:0;border-radius:10px;background:var(--teal);color:#032;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn.dark{background:var(--navy);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--teal);color:var(--ink)}.btn.red{background:var(--bad);color:#fff}
.wrap{display:flex;flex-direction:column;min-height:calc(100vh - 70px)}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1 0 auto;min-height:56px;padding:6px 14px;border:0;background:none;color:var(--ink);font-weight:600;cursor:pointer;border-bottom:4px solid transparent}
nav button.on{border-bottom-color:var(--teal);background:var(--sand)}
main{padding:14px;max-width:1100px;width:100%;margin:0 auto}
.banner{background:var(--sand);border-left:5px solid var(--warn);padding:8px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.card h3{margin:0 0 6px}
.stat{font-size:1.7rem;font-weight:800;color:var(--teal)}.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--sand);color:var(--ink)}
.big{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}.big b{font-size:1.5rem;color:#7fe0d8}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--sand)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:var(--navy);color:#fff;padding:12px 14px;border-radius:10px;border-left:6px solid var(--teal)}#toast .e{border-left-color:#ff6b5e}
@media print{header,nav,.noprint,#toast,.banner{display:none!important}body{background:#fff;color:#000}}
@media(min-width:800px){main{padding:24px}}

<script>

{id:5,date:'2026-11-25',fish:'Dilis (Anchovy)',kg:80,grade:'B',loc:'Roxas Landing',avail:'05:30',sp:'Fresh',own:'fisher',sold:true}],

bids:[],sales:[],audit:[],nb:1,ns:1};
function B(l,who,amt,ago,s){D.bids.push({id:D.nb++,l,who,amt,ts:NOW-ago*M,s:s||'Active'})}
B(1,'b1',112,30);B(1,'b2',125,20);B(1,'b1',140,8);B(2,'b3',95,12);B(3,'b2',210,40);B(3,'b3',230,25);B(4,'b2',62,1500);B(4,'b1',70,1450);
D.sales.push({id:D.ns++,l:4,buyer:'b1',amt:70,st:'Paid',ts:NOW-1400*M,rc:'TC-0001'});
function log(a){D.audit.unshift({ts:Date.now(),who:U[cur].n,a})}
log('Sample data loaded');
const P=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const T=t=>new Date(t).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=id=>D.catches.find(c=>c.id==id),L=id=>D.listings.find(l=>l.id==id);
const act=l=>D.bids.filter(b=>b.l==l&&b.s=='Active');
const hi=l=>act(l).sort((a,b)=>b.amt-a.amt)[0];
const left=l=>{const s=Math.max(0,Math.floor((l.dl-Date.now())/1000));return s?Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s':'Closed'};
const minNext=l=>{const t=hi(l.id);return t?t.amt+l.inc:l.start};
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';document.getElementById('toast').append(d);setTimeout(()=>d.remove(),4500)}
const NAV={admin:[['users','👥 Accounts'],['rules','⚙️ Fish types & rules'],['audit','📜 Audit log'],['backup','💾 Backup & restore']],
fisher:[['home','🏠 My dashboard'],['catch','🎣 Record catch'],['lst','🏷️ My listings'],['sales','💰 Sales & earnings']],
buyer:[['browse','🔎 Browse listings'],['mybids','🔨 My bids'],['buys','🧾 My purchases']],
office:[['rep','📊 Reports']]};
const grp=r=>r.startsWith('b')?'buyer':r;
function setRole(r){cur=r;tab=NAV[grp(r)][0][0];sel=null;rcpt=null;go()}
document.getElementById('role').innerHTML=Object.keys(U).map(k=>`<option value="${k}" ${k==cur?'selected':''}>${U[k].r} – ${U[k].n}</option>`).join('');
function go(t){if(t){tab=t;sel=null}
 const ok=NAV[grp(cur)].map(x=>x[0]);if(!ok.includes(tab))tab=ok[0];
 document.getElementById('nav').innerHTML=NAV[grp(cur)].map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 document.getElementById('view').innerHTML=(V[tab]||(()=>''))();}
function tick(){let ch=0;D.listings.forEach(l=>{if(l.st=='Open'&&Date.now()>=l.dl){l.st=!act(l.id).length?'No bids':'Closed';D.audit.unshift({ts:Date.now(),who:'System',a:`Bidding closed automatically on listing #${l.id}`});ch=1;toast(`Bidding closed on listing #${l.id}.`)}});
 if(ch)go();else document.querySelectorAll('[data-dl]').forEach(e=>e.textContent=left({dl:+e.dataset.dl}))}
setInterval(tick,1000);
const lbl=l=>{const c=C(l.c);return `${c.fish} · ${c.kg} kg · Grade ${c.grade}`};
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')||'<tr><td>No records found.</td></tr>'}</table></div>`;
function ledger(id){return tbl(['Bidder','Amount','Time','Status'],D.bids.filter(b=>b.l==id).sort((a,b)=>a.ts-b.ts).map(b=>[esc(U[b.who].n),P(b.amt),T(b.ts),b.s]))}
const V={
users:()=>`<h2>👥 User accounts and roles</h2>`+tbl(['Name','Role','Access'],Object.values(U).map(u=>[u.n,u.r,'Own role pages only']))+`<p class="hint">Use the “Sign in as” menu above to try each role.</p>`,
rules:()=>`<h2>⚙️ Fish types and bidding rules</h2><div class="grid"><div class="card"><h3>🐠 Fish types</h3>${D.types.map(t=>'• '+t).join('<br>')}</div><div class="card"><h3>🔨 Bidding rules</h3>Default minimum increase: ${P(D.rules.minInc)}<br>Longest auction: ${D.rules.maxHours} hours<br>No-bid outcome: ${D.rules.relist} or direct negotiation<br>Bids are final records and cannot be deleted.</div></div>`,
audit:()=>`<h2>📜 Audit log</h2><p class="hint">Bids, withdrawals and price decisions are recorded here.</p>`+tbl(['Time','Who','Action'],D.audit.map(a=>[T(a.ts),esc(a.who),esc(a.a)])),
backup:()=>`<h2>💾 Backup and restore</h2><div class="card"><p>Last backup: today 02:00 (sample). Backups are encrypted and only the Administrator can restore them.</p><button class="btn" onclick="log('Backup created');toast('Backup created (demo only).');go()">💾 Create backup now</button><button class="btn ghost" onclick="if(confirm('Restore the latest backup? Newer records may be replaced.')){log('Restore started');toast('Restore simulated (demo only).');go()}">♻️ Restore latest backup</button></div>`,
home:()=>{const my=D.catches.filter(c=>c.own=='fisher'),st=my.filter(c=>!c.sold).reduce((a,c)=>a+c.kg,0),ea=D.sales.filter(s=>s.st=='Paid').reduce((a,s)=>a+s.amt*C(L(s.l).c).kg,0);

catch:()=>`<h2>🎣 Record a catch</h2><div class="card"><label>Catch date<input id="cd" type="date" value="2026-11-27"></label><label>Fish type<select id="cf">${D.types.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Weight in kg<input id="ck" type="number" min="1" inputmode="decimal"></label><label>Quality grade<select id="cg"><option>A</option><option>B</option><option>C</option></select></label><label>Landing location<input id="cl" placeholder="Example: Calapan Fish Port"></label><label>Available from (time)<input id="ct" type="time" value="08:00"></label><button class="btn" onclick="addCatch()">✅ Save catch</button></div>`,
lst:()=>{if(sel)return V.ldet();const mine=D.listings;const free=D.catches.filter(c=>!c.sold&&!D.listings.some(l=>l.c==c.id&&['Open','Closed'].includes(l.st)));
 return `<h2>🏷️ My listings</h2><div class="card"><h3>Create a listing</h3><label>Catch<select id="nc">${free.map(c=>`<option value="${c.id}">${c.fish} · ${c.kg} kg · ${c.date}</option>`).join('')||'<option value="">No unlisted catch</option>'}</select></label><label>Starting price per kg (₱)<input id="np" type="number" min="1" inputmode="decimal"></label><label>Minimum bid increase (₱)<input id="ni" type="number" value="${D.rules.minInc}" min="1"></label><label>Bidding closes in (minutes)<input id="nm" type="number" value="60" min="1"></label><button class="btn" onclick="addList()">🏷️ Publish listing</button></div><h3>Listings</h3><div class="grid">${mine.map(l=>card(l,'lst')).join('')}</div>`},
ldet:()=>{const l=L(sel),t=hi(l.id),c=C(l.c);let a='';
 if(l.st=='Closed')a=`<h3>Choose a bid</h3><p class="hint">Bidding is closed. You may accept the highest bid or another valid bid.</p>`+act(l.id).sort((a,b)=>b.amt-a.amt).map(b=>`<div class="card" style="margin:6px 0">${esc(U[b.who].n)} – <b>${P(b.amt)}/kg</b> = ${P(b.amt*c.kg)} <button class="btn" onclick="accept(${b.id})">✅ Accept this bid</button></div>`).join('');
 if(l.st=='No bids')a=`<div class="card"><h3>No bids received</h3><p>Choose what to do next:</p><button class="btn" onclick="relist(${l.id})">🔁 Relist for 2 hours</button><button class="btn ghost" onclick="negot(${l.id})">🤝 Negotiate directly</button></div>`;
 if(l.st=='Open')a=`<button class="btn ghost" onclick="fast(${l.id})">⏩ Demo: close bidding now</button>`;
 return `<button class="btn ghost" onclick="sel=null;go()">← Back</button><h2>${esc(lbl(l))}</h2><span class="tag">${l.st}</span>${box(l,t)}${a}<h3>📖 Bid ledger</h3>${ledger(l.id)}`},
sales:()=>{const rows=D.sales.map(s=>{const l=L(s.l),c=C(l.c),tot=s.amt*c.kg;return [s.id,c.fish,esc(U[s.buyer].n),P(tot),s.st,s.st=='Confirmed'?`<button class="btn" onclick="pay(${s.id})">💵 Record payment</button>`:s.st=='Paid'?`<button class="btn ghost" onclick="rcpt=${s.id};go()">🧾 Receipt</button>`:'Waiting for buyer']});
 const ea=D.sales.filter(s=>s.st=='Paid').reduce((a,s)=>a+s.amt*C(L(s.l).c).kg,0);
 return `<h2>💰 Sales and earnings</h2><div class="card">Total earnings<div class="stat">${P(ea)}</div></div>${tbl(['Sale','Fish','Buyer','Total','Status','Action'],rows)}${rc()}`},
browse:()=>{if(sel)return V.bdet();return `<h2>🔎 Fish for sale</h2><div class="card"><label>Search fish<input id="q" oninput="filt()" placeholder="Example: bangus"></label><label>Status<select id="fs" onchange="filt()"><option>Open</option><option>All</option></select></label></div><div class="grid" id="bl">${blist('','Open')}</div>`},
bdet:()=>{const l=L(sel),t=hi(l.id),c=C(l.c),mine=act(l.id).find(b=>b.who==cur);
 const f=l.st=='Open'?`<div class="card"><label>Your bid per kg (₱)<span class="hint"> – at least ${P(minNext(l))}</span><input id="ba" type="number" inputmode="decimal" value="${minNext(l)}"></label><button class="btn" onclick="bid(${l.id})">${mine?'✏️ Update my bid':'🔨 Place bid'}</button>${mine?`<button class="btn red" onclick="wd(${l.id})">↩️ Withdraw my bid</button>`:''}</div>`:`<p class="warn"><b>Bidding is closed.</b> The seller will choose a bid.</p>`;
 return `<button class="btn ghost" onclick="sel=null;go()">← Back</button><h2>${esc(lbl(l))}</h2><p>Seller: ${U.fisher.n}<br>Landing: ${esc(c.loc)} · Available ${c.avail} · Spoilage: ${c.sp}</p>${box(l,t)}${f}<h3>📖 Bid history</h3>${ledger(l.id)}`},
mybids:()=>`<h2>🔨 My bids</h2>`+tbl(['Listing','My bid/kg','Time','Status','Highest now'],D.bids.filter(b=>b.who==cur).map(b=>{const l=L(b.l),t=hi(l.id);return [esc(lbl(l)),P(b.amt),T(b.ts),b.s,t?P(t.amt):'-']})),
buys:()=>`<h2>🧾 My purchases</h2>`+tbl(['Sale','Fish','Total','Status','Action'],D.sales.filter(s=>s.buyer==cur).map(s=>{const c=C(L(s.l).c);return [s.id,c.fish,P(s.amt*c.kg),s.st,s.st=='Awaiting payment'?`<button class="btn" onclick="conf(${s.id})">✅ Confirm purchase</button>`:s.st=='Paid'?`<button class="btn ghost" onclick="rcpt=${s.id};go()">🧾 Receipt</button>`:'Waiting for seller payment record']}))+rc(),
rep:()=>`<h2>📊 Reports</h2><div class="card noprint"><label>Report type<select id="rt" onchange="rep()">${['Catch','Sales','Price','Bidding','Spoilage','Payment','Earnings'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Search<input id="rq" oninput="rep()" placeholder="Type a name, fish or status"></label><button class="btn" onclick="exp()">⬇️ Export CSV</button><button class="btn dark" onclick="window.print()">🖨️ Print</button></div><div id="rb">${repT('Catch','')}</div>`};
function box(l,t){return `<div class="big">Current highest valid bid<br><b>${t?P(t.amt)+'/kg':'No bids yet'}</b><br>Starting price ${P(l.start)} · Minimum increase <b>${P(l.inc)}</b><br>⏰ Time left: <b data-dl="${l.dl}">${left(l)}</b></div>`}
function card(l,w){const t=hi(l.id),c=C(l.c);return `<div class="card"><h3>🐟 ${c.fish}</h3>${c.kg} kg · Grade ${c.grade} · <span class="tag">${l.st}</span><br>${t?'Highest: <b>'+P(t.amt)+'/kg</b>':'Start: '+P(l.start)+'/kg'} · +${P(l.inc)} min<br>⏰ <span data-dl="${l.dl}">${left(l)}</span><br><button class="btn" onclick="sel=${l.id};go()">${w=='lst'?'📂 Manage':'👁️ View & bid'}</button></div>`}
function blist(q,s){const r=D.listings.filter(l=>(s=='All'||l.st=='Open')&&lbl(l).toLowerCase().includes(q.toLowerCase()));return r.map(l=>card(l,'b')).join('')||'<p>No listings match your search. Try a shorter word.</p>'}
function filt(){document.getElementById('bl').innerHTML=blist(q.value,fs.value)}
function rc(){if(!rcpt)return '';const s=D.sales.find(x=>x.id==rcpt),c=C(L(s.l).c);return `<div class="card" style="border:2px dashed var(--teal);margin-top:12px"><h3>🧾 Digital receipt ${s.rc}</h3>${c.fish} · ${c.kg} kg × ${P(s.amt)}/kg<br><b>Total paid: ${P(s.amt*c.kg)}</b><br>Seller: ${U.fisher.n}<br>Buyer: ${esc(U[s.buyer].n)}<br>Paid: ${T(s.ts)}<br><button class="btn dark noprint" onclick="window.print()">🖨️ Print</button></div>`}
function addCatch(){const k=+ck.value;if(!k||k<=0)return toast('Please enter the weight in kg (a number above 0).',1);if(!cl.value.trim())return toast('Please type the landing location.',1);
 D.catches.push({id:D.catches.length+1,date:cd.value,fish:cf.value,kg:k,grade:cg.value,loc:cl.value.trim(),avail:ct.value,sp:'Fresh',own:'fisher',sold:false});log(`Recorded catch: ${cf.value}, ${k} kg`);toast('Catch saved. Next: create a listing.');go('lst')}
function addList(){const c=+nc.value,p=+np.value,i=+ni.value,m=+nm.value;if(!c)return toast('Record a catch first.',1);if(!p||p<=0)return toast('Enter a starting price above 0.',1);if(!i||i<=0)return toast('Enter a minimum increase above 0.',1);if(!m||m<1||m>D.rules.maxHours*60)return toast('Closing time must be 1 to 1440 minutes.',1);
 const id=D.listings.length+1;D.listings.push({id,c,start:p,inc:i,dl:Date.now()+m*M,st:'Open'});log(`Created listing #${id}, start ${P(p)}/kg`);toast('Listing published. Buyers can now bid.');go()}
function bid(id){const l=L(id),a=+ba.value;if(l.st!='Open'||Date.now()>=l.dl)return toast('Bidding has closed. Bids are no longer accepted.',1);
 if(!a||a<minNext(l))return toast(`Bid too low. Please bid at least ${P(minNext(l))} per kg.`,1);
 D.bids.forEach(b=>{if(b.l==id&&b.who==cur&&b.s=='Active')b.s='Replaced'});D.bids.push({id:D.nb++,l:id,who:cur,amt:a,ts:Date.now(),s:'Active'});log(`Bid ${P(a)}/kg on listing #${id}`);toast('Bid recorded in the ledger.');go()}
function wd(id){const l=L(id);if(Date.now()>=l.dl)return toast('Too late to withdraw. Bidding has closed.',1);D.bids.forEach(b=>{if(b.l==id&&b.who==cur&&b.s=='Active')b.s='Withdrawn'});log(`Withdrew bid on listing #${id}`);toast('Your bid was withdrawn. It stays in the history.');go()}
function fast(id){L(id).dl=Date.now();tick()}
function accept(bid){const b=D.bids.find(x=>x.id==bid),l=L(b.l);l.st='Sold';C(l.c).sold=true;const id=D.ns++;D.sales.push({id,l:l.id,buyer:b.who,amt:b.amt,st:'Awaiting payment',ts:Date.now(),rc:'TC-'+String(id).padStart(4,'0')});
 const t=hi(l.id);log(`Accepted ${P(b.amt)}/kg from ${U[b.who].n} on listing #${l.id}`+(t&&t.id!=b.id?' (not the highest bid)':' (highest bid)'));toast('Bid accepted. Stock updated. Waiting for the buyer to confirm.');sel=null;go('sales')}
function relist(id){const l=L(id);l.st='Open';l.dl=Date.now()+120*M;log(`Relisted #${id}`);toast('Relisted for 2 hours.');go()}
function negot(id){L(id).st='Direct negotiation';log(`Listing #${id}: direct negotiation`);toast('Marked for direct negotiation.');sel=null;go()}
function conf(id){D.sales.find(s=>s.id==id).st='Confirmed';log(`Buyer confirmed sale #${id}`);toast('Purchase confirmed. Pay the seller at pickup.');go()}
function pay(id){const s=D.sales.find(x=>x.id==id);s.st='Paid';s.ts=Date.now();log(`Payment recorded for sale #${id}`);rcpt=id;toast('Payment recorded. Earnings updated. Receipt ready.');go()}
function repRows(t){const S=D.sales;
 const m={Catch:[['Date','Fish','Kg','Grade','Landing'],D.catches.map(c=>[c.date,c.fish,c.kg,c.grade,c.loc])],
 Sales:[['Sale','Fish','Buyer','Total','Status'],S.map(s=>{const c=C(L(s.l).c);return [s.id,c.fish,U[s.buyer].n,P(s.amt*c.kg),s.st]})],
 Price:[['Listing','Fish','Start/kg','Highest/kg','Status'],D.listings.map(l=>[l.id,C(l.c).fish,P(l.start),hi(l.id)?P(hi(l.id).amt):'-',l.st])],
 Bidding:[['Listing','Bidder','Amount/kg','Time','Status'],D.bids.map(b=>[b.l,U[b.who].n,P(b.amt),T(b.ts),b.s])],
 Spoilage:[['Fish','Kg','Spoilage','Stock'],D.catches.map(c=>[c.fish,c.kg,c.sp,c.sold?'Sold':'In stock'])],
 Payment:[['Sale','Buyer','Amount','Status','Receipt'],S.map(s=>[s.id,U[s.buyer].n,P(s.amt*C(L(s.l).c).kg),s.st,s.st=='Paid'?s.rc:'-'])],
 Earnings:[['Fish','Kg sold','Price/kg','Earned'],S.filter(s=>s.st=='Paid').map(s=>{const c=C(L(s.l).c);return [c.fish,c.kg,P(s.amt),P(s.amt*c.kg)]})]};return m[t]}
function repT(t,q){const [h,r]=repRows(t);return tbl(h,r.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(x=>x.map(esc)))}
function rep(){rb.innerHTML=repT(rt.value,rq.value)}
function exp(){const [h,r]=repRows(rt.value),q=rq.value.toLowerCase();const csv=[h,...r.filter(x=>x.join(' ').toLowerCase().includes(q))].map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=rt.value+'-report.csv';a.click();toast('Report exported (CSV).')}
setRole('fisher');
</script></body></html>
